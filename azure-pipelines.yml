# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: DotNetCoreCLI@2
  displayName: 'Restore solution'
  inputs:
    command: 'restore'
    projects: 'simpleweb.sln'

- task: DotNetCoreCLI@2
  displayName: 'Build solution'
  inputs:
    command: 'build'
    projects: 'simpleweb.sln'
    arguments: '--configuration Release'

- script: |
    year=$(date -u +%y)
    day_of_year=$(date -u +%j)
    hours=$(date -u +%H)
    minutes=$(date -u +%M)
    seconds=$(date -u +%S)
    seconds_of_day=$((10#$hours * 3600 + 10#$minutes * 60 + 10#$seconds))
    build_number="${year}${day_of_year}$(printf '%05d' "$seconds_of_day")"
    echo "##vso[task.setvariable variable=BuildVersionNumber]$build_number"
  displayName: 'Calculate build version number'

- task: DotNetCoreCLI@2
  displayName: 'Publish project output'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: 'simpleweb/simpleweb.csproj'
    arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/publish'
    zipAfterPublish: true

- task: PublishBuildArtifacts@1
  displayName: 'Publish build artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'

- task: GitHubRelease@1
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
  inputs:
    gitHubConnection: 'MyHealthHier'
    repositoryName: '$(Build.Repository.Name)'
    action: 'create'
    target: '$(Build.SourceVersion)'
    tagSource: 'userSpecifiedTag'
    tag: '3.0.1.$(BuildVersionNumber)'
    assets: 
    isPreRelease: true
    makeLatest: 'false'
    changeLogCompareToRelease: 'lastFullRelease'
    changeLogType: 'commitBased'
